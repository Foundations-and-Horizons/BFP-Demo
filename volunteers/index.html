function handleForm(fn){$('#editForm').onsubmit=e=>{e.preventDefault();try{fn(new FormData(e.target));save();$('#modal').close();render();notify('Saved in this demo.')}catch(err){$('#formError').textContent=err.message}}}
function editProfile(id){const creating=!id,p=id?person(id):{name:'',email:'',phone:'',pin:'',status:'Pending',shirt:'M',roles:[],consent:false,reminders:true,birthday:'',emergency:'',emergencyPhone:'',bio:'',interests:'',notes:'',joined:TODAY};if(!isAdmin()&&id!==selectedPerson)return;showModal(creating?'Add a volunteer':'Edit volunteer',formWrap(`<div class="form-grid">${field('Full name','name',p.name,'text','required maxlength="80"')}${field('Email','email',p.email,'email')}${field('Phone','phone',p.phone,'tel')}${field('Birthday','birthday',p.birthday,'date')}<label>T-shirt size<select name="shirt">${options(['XS','S','M','L','XL','2XL','3XL','Prefer not to say'],p.shirt)}</select></label>${isAdmin()?`<label>Status<select name="status">${options(['Active','Pending','Inactive'],p.status)}</select></label>${field('Unique 4-digit kiosk code','pin',p.pin,'text','required pattern="[0-9]{4}" maxlength="4" inputmode="numeric" autocomplete="off"')}`:''}${field('Emergency contact name','emergency',p.emergency)}${field('Emergency contact phone','emergencyPhone',p.emergencyPhone,'tel')}<label class="full">About me<textarea name="bio" maxlength="500">${esc(p.bio)}</textarea></label>${field('Interests / favorite things','interests',p.interests)}${isAdmin()?`<label class="full">Volunteer roles<div class="checks">${roles.map(r=>`<label><input type="checkbox" name="roles" value="${r}" ${p.roles.includes(r)?'checked':''}>${r}</label>`).join('')}</div></label><label class="full">Coordinator-only note<textarea name="notes" maxlength="1000">${esc(p.notes)}</textarea></label>`:''}<label class="checkline full"><input type="checkbox" name="consent" ${p.consent?'checked':''}>I agree to receive volunteer updates (demo)</label><label class="checkline full"><input type="checkbox" name="reminders" ${p.reminders?'checked':''}>I would like shift reminders (demo)</label></div><p class="tab-note">Kiosk codes identify fictional profiles here. Role previews are not secure authentication.</p>`));handleForm(f=>{if(!f.get('name').trim())throw Error('A name is required.');const values={name:f.get('name').trim(),email:f.get('email'),phone:f.get('phone'),birthday:f.get('birthday'),shirt:f.get('shirt'),emergency:f.get('emergency'),emergencyPhone:f.get('emergencyPhone'),bio:f.get('bio'),interests:f.get('interests'),consent:f.has('consent'),reminders:f.has('reminders')};if(isAdmin()){const pin=f.get('pin');if(!/^\d{4}$/.test(pin)||db.people.some(x=>x.id!==id&&x.pin===pin))throw Error('Choose a unique 4-digit kiosk code.');const assigned=f.getAll('roles');if(!assigned.length)throw Error('Assign at least one role.');if(id&&active(id)&&f.get('status')!=='Active')throw Error('Clock this volunteer out before changing their status.');Object.assign(values,{pin,status:f.get('status'),roles:assigned,notes:f.get('notes')})}if(creating){db.people.push({...values,id:uid(),availability:[],joined:TODAY})}else Object.assign(p,values);audit(creating?'Volunteer added':'Profile updated',values.name)})}
function availabilityRows(p){return p.availability.map(a=>`<div class="entry row"><span><strong>${dayNames[a.day]}</strong> · ${a.start}–${a.end}<br><small>${esc(a.role)} · weekly availability</small></span><button class="small" data-remove-availability="${a.id}" data-person="${p.id}">Remove</button></div>`).join('')||'<p class="muted">No recurring availability yet.</p>'}
function addAvailability(id){const p=person(id);showModal('Recurring weekly availability',formWrap(`<div class="form-grid"><label>Day<select name="day">${dayNames.map((d,i)=>`<option value="${i}">${d}</option>`).join('')}</select></label><label>Role<select name="role">${options(p.roles,p.roles[0])}</select></label>${field('Available from','start','09:00','time','required')}${field('Available until','end','12:00','time','required')}</div><div class="notice good">Availability helps find a match. It does not book a shift or credit hours.</div>`));handleForm(f=>{if(!isAdmin()&&id!==selectedPerson)throw Error('You can only edit your own availability.');if(f.get('end')<=f.get('start'))throw Error('End time must be after start time.');const a={id:uid(),day:+f.get('day'),start:f.get('start'),end:f.get('end'),role:f.get('role')};if(p.availability.some(x=>x.day===a.day&&x.role===a.role&&overlap(x,a)))throw Error('Overlapping availability already exists.');p.availability.push(a);audit('Availability added',p.name)})}
function personSelect(name='person',value=selectedPerson,all=false){return `<select name="${name}" id="${name}">${all?'<option value="all">All volunteers</option>':''}${db.people.map(p=>`<option value="${p.id}" ${value===p.id?'selected':''}>${esc(p.name)}${p.status!=='Active'?' · '+p.status:''}</option>`).join('')}</select>`}
function schedule(){const list=db.shifts.filter(s=>s.date>=scheduleFrom&&s.date<=scheduleTo).sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const p=me();return `${isAdmin()?`<div class="row"><p class="muted">Assignments reserve places. Coverage excludes people who are away or inactive.</p><div class="actions"><button id="recurring">Generate recurring bookings</button><button class="primary" id="addShift">+ Create shift</button><button id="coverageExport">Export coverage</button></div></div>`:`<div class="notice good">Booking a shift reserves a place. Clock in and out when you actually serve.</div>`}<div class="toolbar"><label>From <input id="scheduleFrom" type="date" value="${scheduleFrom}"></label><label>Through <input id="scheduleTo" type="date" value="${scheduleTo}"></label></div>${list.map(s=>{const b=booked(s),valid=eligibleBookings(s),mine=b.find(b=>b.person===p.id);return `<section class="shift ${closed(s.date)?'closed':''}"><div class="row"><div><p class="shift-date">${pretty(s.date)} · ${s.start}–${s.end} · ${esc(s.location)}</p><h3>${esc(s.role)}</h3></div><span class="chip ${closed(s.date)?'red':valid.length<s.capacity?'amber':''}">${closed(s.date)?'Pantry closed':`${valid.length}/${s.capacity} covered`}</span></div><div class="progress"><span style="width:${Math.min(100,valid.length/s.capacity*100)}%"></span></div>${isAdmin()?`<div class="entry"><small>ASSIGNED VOLUNTEERS</small><div class="chips">${b.map(b=>`<span class="chip ${unavailable(b.person,s.date)||person(b.person).status!=='Active'?'red':''}">${esc(person(b.person).name)}${unavailable(b.person,s.date)?' · away':person(b.person).status!=='Active'?' · inactive':''} <button class="small" data-cancel-booking="${b.id}" aria-label="Remove booking for ${esc(person(b.person).name)}">×</button></span>`).join('')||'<p class="muted">No one assigned yet.</p>'}</div></div><div class="actions"><button data-assign="${s.id}" ${closed(s.date)?'disabled':''}>Assign volunteer</button><button class="small" data-matches="${s.id}">Find availability matches</button></div>`:mine?`<div class="row"><span class="chip">You’re signed up${unavailable(p.id,s.date)?' · time away conflict':''}</span><button data-cancel-booking="${mine.id}">Cancel my place</button></div>`:`<button class="primary" data-book="${s.id}" ${closed(s.date)||b.length>=s.capacity||!p.roles.includes(s.role)||unavailable(p.id,s.date)?'disabled':''}>${b.length>=s.capacity?'Full':!p.roles.includes(s.role)?'Role not assigned':unavailable(p.id,s.date)?'You are away':'Sign me up'}</button>`}</section>`}).join('')||empty('No shifts in this date range.')}`}
function createShift(){showModal('Create a service shift',formWrap(`<div class="form-grid">${field('Date','date',datePlus(TODAY,1),'date',`required min="${TODAY}"`)}<label>Role<select name="role">${options(roles,roles[0])}</select></label>${field('Start','start','09:00','time','required')}${field('End','end','11:00','time','required')}${field('Places needed','capacity',4,'number','required min="1" max="100"')}<label>Location<select name="location">${options(['Bountiful pantry','Mobile pantry'],'Bountiful pantry')}</select></label></div>`,'Create shift'));handleForm(f=>{requireAdmin();if(f.get('date')<TODAY||closed(f.get('date')))throw Error('Choose an open future date.');if(f.get('end')<=f.get('start'))throw Error('End time must be after start time.');const s={id:uid(),date:f.get('date'),start:f.get('start'),end:f.get('end'),role:f.get('role'),capacity:+f.get('capacity'),location:f.get('location')};if(db.shifts.some(x=>x.date===s.date&&x.start===s.start&&x.role===s.role&&x.location===s.location))throw Error('This shift already exists.');db.shifts.push(s);audit('Shift created',`${s.date} · ${s.role}`)})}
function assign(sid){const s=shift(sid);showModal('Assign a volunteer',formWrap(`<p>${pretty(s.date)} · ${s.start}–${s.end} · ${s.role}</p><label class="field">Volunteer${personSelect()}</label><p class="tab-note">Role, capacity, time away, and overlapping bookings are checked before saving.</p>`,'Reserve place'));handleForm(f=>{requireAdmin();book(f.get('person'),sid)})}
function matches(sid){const s=shift(sid),list=db.people.filter(p=>p.status==='Active'&&p.roles.includes(s.role)&&!unavailable(p.id,s.date)&&p.availability.some(a=>a.day===weekDay(s.date)&&a.role===s.role&&a.start<=s.start&&a.end>=s.end));showModal('Availability matches',`<p>${pretty(s.date)} · ${s.start}–${s.end} · ${s.role}</p>${list.map(p=>`<div class="entry row"><strong>${esc(p.name)}</strong><button data-direct-book="${p.id}" data-shift="${sid}">Reserve place</button></div>`).join('')||empty('No matching availability. You can still assign an available volunteer manually.')}<p class="tab-note">These are availability suggestions; overlap and capacity are checked on booking.</p>`)}
function recurring(){showModal('Create recurring bookings',formWrap(`<p>Match one volunteer’s weekly availability to existing shifts in this date range.</p><div class="form-grid"><label class="full">Volunteer${personSelect()}</label>${field('From','from',scheduleFrom,'date',`required min="${TODAY}"`)}${field('Through','to',scheduleTo,'date','required')}</div><div class="notice">This creates reservations only. Conflicts, closed dates, duplicate bookings and full shifts are skipped. No shifts or service hours are invented.</div>`,'Generate bookings'));handleForm(f=>{requireAdmin();const p=person(f.get('person')),from=f.get('from'),to=f.get('to');if(from<TODAY||to<from||to>datePlus(from,90))throw Error('Choose a range of up to 90 days, starting today or later.');let added=0,skipped=0;for(const s of db.shifts.filter(s=>s.date>=from&&s.date<=to&&p.availability.some(a=>a.day===weekDay(s.date)&&a.role===s.role&&a.start<=s.start&&a.end>=s.end))){try{book(p.id,s.id);added++}catch{skipped++}}audit('Recurring bookings generated',`${p.name} · ${added} reserved · ${skipped} skipped`);setTimeout(()=>notify(`${added} places reserved; ${skipped} conflicts or duplicates skipped.`),100)})}
function awayView(){const mine=isAdmin()?db.away:db.away.filter(a=>a.person===selectedPerson),monthStart=TODAY.slice(0,8)+'01',offset=weekDay(monthStart),days=new Date(+TODAY.slice(0,4),+TODAY.slice(5,7),0).getDate();return `<div class="actions"><button class="primary" id="addAway">+ Record time away</button>${isAdmin()?'<button id="addClosure">+ Add pantry closure</button>':''}</div><h2 class="split-title">${new Intl.DateTimeFormat('en-US',{month:'long',year:'numeric',timeZone:'UTC'}).format(new Date(TODAY+'T12:00:00Z'))}</h2><div class="calendar">${dayNames.map(d=>`<div class="calendar-head">${d.slice(0,3)}</div>`).join('')}${Array.from({length:offset},()=>'<div></div>').join('')}${Array.from({length:days},(_,i)=>{const d=monthStart+String(i+1).padStart(2,'0'),a=mine.filter(a=>a.from<=d&&a.to>=d);return `<div class="day ${d===TODAY?'today':''}"><strong>${i+1}</strong>${closed(d)?'<br><span class="chip red">Pantry closed</span>':''}${a.map(a=>`<br><span class="chip amber">${isAdmin()?esc(person(a.person).name.split(' ')[0]):'Away'}</span>`).join('')}</div>`}).join('')}</div><div class="grid two"><section class="panel"><h2>Time away</h2>${mine.map(a=>`<div class="entry row"><div><strong>${esc(person(a.person).name)}</strong><p>${pretty(a.from)} – ${pretty(a.to)}</p><p>${esc(a.reason||'Time away')}</p></div><button class="small" data-remove-away="${a.id}">Remove</button></div>`).join('')||empty('No time away recorded.')}</section><section class="panel"><h2>Pantry closures</h2>${db.closures.map(c=>`<div class="entry row"><div><strong>${esc(c.reason)}</strong><p>${pretty(c.from)} – ${pretty(c.to)}</p></div>${isAdmin()?`<button class="small" data-remove-closure="${c.id}">Remove</button>`:''}</div>`).join('')||empty('No closures recorded.')}<div class="notice">Existing reservations remain visible for follow-up. People away stop counting toward coverage; closed dates block new bookings and clock-ins.</div></section></div>`}
function awayForm(closure=false){showModal(closure?'Pantry closure':'Record time away',formWrap(`<div class="form-grid">${!closure&&isAdmin()?`<label class="full">Volunteer${personSelect()}</label>`:''}${field('From','from',TODAY,'date','required')}${field('Through','to',datePlus(TODAY,1),'date','required')}${field(closure?'Closure reason':'Optional note','reason','','text',closure?'required maxlength="200"':'maxlength="200"')}</div>`));handleForm(f=>{if(closure)requireAdmin();const from=f.get('from'),to=f.get('to');if(to<from)throw Error('End date must be on or after start date.');const record={id:uid(),from,to,reason:f.get('reason')};if(closure){if(db.closures.some(c=>c.from<=to&&c.to>=from))throw Error('A closure already covers these dates.');db.closures.push(record)}else{record.person=isAdmin()?f.get('person'):selectedPerson;if(db.away.some(a=>a.person===record.person&&a.from<=to&&a.to>=from))throw Error('Time away already covers these dates.');db.away.push(record)}audit(closure?'Closure added':'Time away added',`${from} – ${to}`)})}
function clockView(){if(mode==='Kiosk')return `<section class="panel kiosk"><span class="chip">4-DIGIT CHECK-IN</span><h2 class="split-title">Thanks for showing up.</h2><p class="muted">Enter your volunteer code to begin.</p><form id="kioskForm"><label for="pin" class="caption">Volunteer code</label><br><input id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" required autocomplete="off" aria-label="4-digit volunteer code"><div class="keypad">${['1','2','3','4','5','6','7','8','9','Clear','0','⌫'].map(k=>`<button type="button" data-key="${k}" aria-label="${k==='⌫'?'Backspace':k}">${k}</button>`).join('')}</div><button class="primary">Continue →</button><p id="kioskError" class="error" role="alert"></p></form><p class="tab-note">Try fictional code <strong>1042</strong> for Alex.<br>Kiosk returns to this screen after recording time.</p></section>`;const p=me(),s=active(p.id);return `<div class="grid two"><section class="panel"><div class="row"><h2>${isAdmin()?'Volunteer timeclock':'My timeclock'}</h2><span class="chip ${s?'':'blue'}">${s?'Currently serving':'Ready when you are'}</span></div>${isAdmin()?`<label class="field">Volunteer${personSelect('clockPerson')}</label>`:`<h3>${esc(p.name)}</h3>`}<div class="profile-stats">${s?`<small>CLOCKED IN AT</small><b>${stamp(s.in)}</b><span>${esc(s.role)} · elapsed <span id="elapsed">${elapsed(s)}</span></span>`:`<small>RECORDED SERVICE</small><b>${hoursText(p.id)} hours</b><span>From completed clock sessions</span>`}</div>${s?`<button class="primary" id="clockOut">Clock out now</button>`:`<label class="field">Serving as<select id="clockRole">${options(p.roles,p.roles[0])}</select></label><button class="primary" id="clockIn" style="margin-top:18px" ${p.status!=='Active'?'disabled':''}>Clock in now</button>`}<div class="notice good">Clock-out uses actual elapsed time. Booking, availability, and roles never add hours.</div></section><section class="panel"><h2>${isAdmin()?'On site now':'My recent service'}</h2>${isAdmin()?db.sessions.filter(s=>!s.out).map(s=>`<div class="entry"><strong>${esc(person(s.person).name)}</strong><p>${esc(s.role)} · since ${stamp(s.in)}</p><p>${elapsed(s)} elapsed</p></div>`).join('')||empty('No volunteers clocked in.'):sessionTable(db.sessions.filter(s=>s.person===p.id).slice(-5).reverse(),false)}${isAdmin()?'<button data-go="reports">Review hours & corrections →</button>':''}</section></div>`}
function elapsed(s){const mins=Math.max(0,Math.floor((Date.now()-s.in)/60000));return `${Math.floor(mins/60)} h ${mins%60} min`}
function kioskIdentify(pin){if(!/^\d{4}$/.test(pin))throw Error('Enter a valid volunteer code.');const p=db.people.find(p=>p.pin===pin&&p.status==='Active');if(!p)throw Error('Code unavailable. Please ask a coordinator for help.');kioskPerson=p.id;const s=active(p.id);showModal(`Hello, ${p.name.split(' ')[0]}.`,`<p>${s?'Thanks for serving today. Ready to finish?':'Thank you for sharing your time with our neighbors.'} ${p.birthday?.slice(5,7)===TODAY.slice(5,7)?'Happy birthday month! We’re glad you’re part of our community.':''}</p>${s?`<div class="profile-stats"><small>YOUR SESSION</small><h3>${esc(s.role)}</h3><p>Clocked in ${stamp(s.in)} · ${elapsed(s)} elapsed</p></div><button class="primary" id="kioskOut">Clock out now</button>`:`<label class="field">Serving as<select id="kioskRole">${options(p.roles,p.roles[0])}</select></label><button class="primary" id="kioskIn" style="margin-top:18px">Clock in now</button>`}<p class="muted">Your service this year: ${yearHours(p.id).toFixed(2)} hours</p>${db.closures.filter(c=>c.from>=TODAY&&c.from<=datePlus(TODAY,7)).map(c=>`<div class="notice">Reminder: closed ${pretty(c.from)} – ${pretty(c.to)} · ${esc(c.reason)}</div>`).join('')}<p class="error" id="kioskActionError" role="alert"></p><p class="tab-note">Only this clock action is available at the kiosk.</p>`);clearTimeout(kioskIdentify.timer);kioskIdentify.timer=setTimeout(()=>{if(mode==='Kiosk'){kioskPerson=null;$('#modal').close();render()}},60000)}
function sessionTable(list,adjust=true){return !list.length?empty('No sessions recorded yet. Clock in and out to begin.'):`<div class="table-wrap"><table><thead><tr><th>Volunteer / role</th><th>Clock in</th><th>Clock out</th><th>Hours</th>${adjust?'<th>Review</th>':''}</tr></thead><tbody>${list.map(s=>`<tr><td><strong>${esc(person(s.person).name)}</strong><br><small>${esc(s.role)}</small></td><td>${stamp(s.adjustment?.in??s.in)}</td><td>${s.out?stamp(s.adjustment?.out??s.out):'<span class="chip amber">Clocked in</span>'}</td><td>${s.out?(seconds(s)/3600).toFixed(4):'—'}${s.adjustment?'<br><span class="chip blue">Corrected</span>':''}</td>${adjust?`<td>${s.out?`<button class="small" data-adjust="${s.id}">Adjust</button>`:'Clock out first'}</td>`:''}</tr>`).join('')}</tbody></table></div>`}
function correction(id){const s=db.sessions.find(x=>x.id===id);showModal('Authorized time correction',formWrap(`<p><strong>${esc(person(s.person).name)}</strong> · ${esc(s.role)}</p><p class="tab-note">Original clock-in: ${new Date(s.in).toISOString()}<br>Original clock-out: ${new Date(s.out).toISOString()}</p><div class="form-grid">${field('Correct clock-in (ISO with timezone)','start',new Date(s.adjustment?.in??s.in).toISOString(),'text','required')}${field('Correct clock-out (ISO with timezone)','end',new Date(s.adjustment?.out??s.out).toISOString(),'text','required')}<label class="full">Reason for correction<textarea name="reason" required maxlength="500"></textarea></label></div><div class="notice">Original timestamps are retained. Every correction records the old and new values, reason, coordinator, and time.</div>`,'Apply correction'));handleForm(f=>adjustSession(id,f.get('start'),f.get('end'),f.get('reason')))}
function home(){const p=me(),bookings=db.bookings.filter(b=>b.person===p.id&&shift(b.shift).date>=TODAY),messages=db.messages.filter(m=>m.recipients.includes(p.id));return `<div class="toolbar"><label>Demo volunteer ${personSelect('volunteerPerson')}</label><button data-profile="${p.id}">View & edit my profile</button></div><div class="hero"><h2>Welcome back, ${esc(p.name.split(' ')[0])}.</h2><p>Your presence matters here. Thank you for being part of this community. ${p.birthday?.slice(5,7)===TODAY.slice(5,7)?'Happy birthday month! We’re glad we get to celebrate you.':''}</p><button data-go="clock">Clock in / out →</button></div><div class="grid metrics">${metric('My service this year',yearHours(p.id).toFixed(2)+' h','Completed clock sessions · '+TODAY.slice(0,4))}${metric('My upcoming shifts',bookings.length,'Reserved places')}${metric('My assigned roles',p.roles.length,'Ways you can help')}${metric('Thank-you moments',db.care.filter(c=>c.person===p.id).length,'You are appreciated')}</div><div class="grid two"><section class="panel"><div class="row"><h2>My next service</h2><button data-go="schedule" class="small">Find a shift</button></div>${bookings.map(b=>{const s=shift(b.shift);return `<div class="entry row"><div><strong>${esc(s.role)}</strong><p>${pretty(s.date)} · ${s.start}–${s.end}</p><span class="chip ${closed(s.date)||unavailable(p.id,s.date)?'red':''}">${closed(s.date)?'Pantry closed':unavailable(p.id,s.date)?'Time away conflict':'Reserved'}</span></div><button class="small" data-cancel-booking="${b.id}">Cancel place</button></div>`}).join('')||empty('Your next helping hand starts with finding a shift.')}<h3 class="split-title">My weekly availability</h3>${availabilityRows(p)}<button data-availability="${p.id}">+ Add availability</button></section><section class="panel"><h2>My updates</h2>${messages.map(m=>`<div class="inbox"><strong>${esc(m.subject)}</strong><p>${esc(m.body)}</p><small>${stamp(m.at)} · Demo inbox</small></div>`).join('')||empty('No updates yet.')}<h3 class="split-title">A little appreciation</h3>${db.care.filter(c=>c.person===p.id).map(c=>`<div class="inbox"><strong>${esc(c.kind)}</strong><p>${esc(c.message)}</p></div>`).join('')||'<p class="muted">Every minute of care makes a difference.</p>'}</section></div>`}
function careView(){return `<div class="hero"><h2>Make appreciation part of the everyday.</h2><p>A personal note, a birthday remembered, a contribution recognized. Small gestures help volunteers feel they belong.</p></div><div class="grid two" style="margin-top:22px"><section class="panel"><h2>People to celebrate</h2>${db.people.filter(p=>p.status==='Active').map(p=>`<div class="entry row"><div><strong>${esc(p.name)}</strong><p>${p.birthday?'Birthday '+p.birthday.slice(5):'Birthday not provided'} · ${hoursText(p.id)} service hours</p><p>${esc(p.interests)}</p></div><div class="actions"><button class="small" data-recognize="${p.id}">Recognize</button><button class="small" data-certificate="${p.id}">Certificate</button></div></div>`).join('')}</section><section class="panel"><h2>Recognition journal</h2>${db.care.map(c=>`<div class="entry"><div class="row"><strong>${esc(person(c.person).name)}</strong><span class="chip">${esc(c.kind)}</span></div><p>${esc(c.message)}</p><small>${stamp(c.at)} · ${esc(c.by)}</small></div>`).join('')||empty('Start with a thoughtful thank-you.')}<div class="notice good">Recognition is saved to the volunteer’s profile and demo home. Nothing is sent externally.</div></section></div>`}
function recognize(id){requireAdmin();const p=person(id);showModal('A moment of appreciation',formWrap(`<p>For <strong>${esc(p.name)}</strong></p><label class="field">Recognition type<select name="kind">${options(['Personal thank-you','Birthday wishes','Service anniversary','Milestone','Gift / appreciation received'],'Personal thank-you')}</select></label><label class="field" style="margin-top:15px">Personal message<textarea name="message" required maxlength="1500">${esc(`Thank you, ${p.name.split(' ')[0]}, for the care you bring to our pantry. We’re glad you’re here.`)}</textarea></label>`,'Save recognition'));handleForm(f=>{requireAdmin();if(!f.get('message').trim())throw Error('Write a short message first.');db.care.unshift({id:uid(),person:id,kind:f.get('kind'),message:f.get('message').trim(),at:Date.now(),by:'Demo coordinator'});audit('Recognition saved',p.name)})}

g your time and care<br>with the Bountiful Food Pantry community.</p><p><strong>${hoursText(id)} completed service hours</strong></p><small>Fictional demonstration · ${pretty(TODAY)}<br>Generated from completed clock sessions across all dates.<br>Recognition only; not an official service verification.</small></div><div class="form-actions"><button id="print">Print certificate</button></div>`)}
function messagesView(){return `<div class="actions"><button class="primary" id="compose">+ Compose update</button><button id="reminders">Generate tomorrow’s reminders</button><button id="birthdayMessages">Generate birthday wishes</button></div><div class="notice good">Messages are delivered only to the synthetic demo inbox. No email or text is sent. Consent and reminder preferences are respected.</div><div class="grid two"><section class="panel"><h2>Message journal</h2>${db.messages.map(m=>`<div class="entry"><div class="row"><strong>${esc(m.subject)}</strong><span class="chip blue">${m.recipients.length} demo inboxes</span></div><p>${esc(m.body)}</p><small>${stamp(m.at)} · ${esc(m.kind)} · Demo delivery</small></div>`).join('')||empty('No updates created yet.')}</section><section class="panel"><h2>Communication preferences</h2>${db.people.filter(p=>p.status==='Active').map(p=>`<div class="entry row"><span><strong>${esc(p.name)}</strong><br><small>${p.reminders?'Shift reminders on':'Shift reminders off'}</small></span><span class="chip ${p.consent?'':'amber'}">${p.consent?'Updates allowed':'No consent'}</span></div>`).join('')}</section></div>`}
function compose(){showModal('Compose a volunteer update',formWrap(`<div class="form-grid"><label class="full">Audience<select name="audience">${options(['All active volunteers',...roles],'All active volunteers')}${db.people.filter(p=>p.status==='Active').map(p=>`<option value="person:${p.id}">Just ${esc(p.name)}</option>`).join('')}</select></label>${field('Subject','subject','','text','required maxlength="150"')}<label class="full">Message<textarea name="body" required maxlength="3000"></textarea></label></div><div class="notice">Only active volunteers with update consent receive this in their demo inbox.</div>`,'Deliver to demo inbox'));handleForm(f=>{requireAdmin();const recipients=db.people.filter(p=>p.status==='Active'&&p.consent&&(f.get('audience')==='All active volunteers'||p.roles.includes(f.get('audience'))||f.get('audience')==='person:'+p.id)).map(p=>p.id);if(!recipients.length)throw Error('No consenting volunteers match this audience.');if(!f.get('subject').trim()||!f.get('body').trim())throw Error('Subject and message are required.');db.messages.unshift({id:uid(),recipients,subject:f.get('subject').trim(),body:f.get('body').trim(),kind:'Coordinator update',at:Date.now()});audit('Demo update delivered',`${recipients.length} recipients`)})}
function reminders(){requireAdmin();const tomorrow=datePlus(TODAY,1);let count=0;for(const b of db.bookings){const s=shift(b.shift),p=person(b.person),key=`${b.id}:${tomorrow}`;if(s.date!==tomorrow||closed(s.date)||unavailable(p.id,s.date)||p.status!=='Active'||!p.consent||!p.reminders||db.reminderRuns.includes(key))continue;db.messages.unshift({id:uid(),recipients:[p.id],subject:`Your service tomorrow · ${s.role}`,body:`Hi ${p.name.split(' ')[0]}, we look forward to seeing you at ${s.location}, ${s.start}–${s.end}. Please clock in when you arrive and clock out when you finish.`,kind:'Shift reminder',at:Date.now()});db.reminderRuns.push(key);count++}audit('Demo reminders generated',`${count} delivered for ${tomorrow}`);save();render();notify(`${count} new reminders delivered to demo inboxes.`)}
function birthdayMessages(){requireAdmin();let count=0;for(const p of db.people){const key='birthday:'+p.id+':'+TODAY.slice(0,7);if(p.status!=='Active'||!p.consent||p.birthday?.slice(5,7)!==TODAY.slice(5,7)||db.reminderRuns.includes(key))continue;db.messages.unshift({id:uid(),recipients:[p.id],subject:'Happy birthday month, '+p.name.split(' ')[0]+'!',body:'Wishing you a wonderful birthday month. Thank you for bringing your time, kindness, and care to our pantry community. We’re glad you’re here.',kind:'Birthday wishes',at:Date.now()});db.reminderRuns.push(key);count++}audit('Demo birthday wishes generated',count+' messages for '+TODAY.slice(0,7));save();render();notify(count+' new birthday wishes delivered to demo inboxes.')}
function reportsView(){const rows=report(),total=rows.reduce((n,s)=>n+seconds(s)/3600,0);return `<div class="toolbar"><label>From <input id="reportFrom" type="date" value="${reportFrom}"></label><label>Through <input id="reportTo" type="date" value="${reportTo}"></label><select id="reportRole" aria-label="Report role">${options(['All roles',...roles],reportRole)}</select><label>Volunteer ${personSelect('reportPerson',reportPerson,true)}</label><button id="exportHours" class="primary">Export hours CSV</button><button id="print">Print report</button></div><p class="tab-note">Sessions are grouped by their clock-in date in Mountain time. Totals use exact elapsed seconds; display rounding does not alter records.</p><div class="grid metrics">${metric('Completed service',total.toFixed(4)+' h','Selected dates and filters')}${metric('Completed sessions',rows.length,'Open sessions excluded')}${metric('People who served',new Set(rows.map(s=>s.person)).size,'Unique volunteers in range')}${metric('Corrected sessions',rows.filter(s=>s.adjustment).length,'Original times retained')}</div>${sessionTable(rows.slice().reverse())}<h2 class="split-title">Service by role</h2><section class="panel">${roles.map(r=>{const h=rows.filter(s=>s.role===r).reduce((n,s)=>n+seconds(s)/3600,0);return `<div class="entry"><div class="row"><strong>${r}</strong><span>${h.toFixed(4)} h</span></div><div class="progress"><span style="width:${total?h/total*100:0}%"></span></div></div>`}).join('')}</section><h2 class="split-title">Open sessions requiring clock-out</h2>${sessionTable(db.sessions.filter(s=>!s.out),false)}`}
function permissionsView(){return `<section class="panel"><h2>Permission previews</h2><p class="muted">Switch the preview role in the top bar to explore each experience.</p><div class="table-wrap"><table><thead><tr><th>Action</th><th>Coordinator</th><th>Volunteer</th><th>Kiosk</th></tr></thead><tbody>${[['View directory & coordinator notes','Yes','No','No'],['Edit profile & preferences','All profiles','Own profile','No'],['Assign volunteer roles / kiosk codes','Yes','No','No'],['Book service & record time away','All volunteers','Own records','No'],['Clock in / out','All volunteers','Self','Code identified volunteer'],['Correct completed time with audit reason','Yes','No','No'],['Coverage, communications & reporting','Yes','No','No']].map(row=>`<tr>${row.map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="notice">This standalone demo uses browser-local records and role switching. Production needs authenticated users and server-enforced permissions. A kiosk code is not a production login.</div></section><h2 class="split-title">Activity & correction history</h2><section class="panel">${db.audit.slice(0,70).map(a=>`<div class="entry"><div class="row"><strong>${esc(a.action)}</strong><small>${stamp(a.at)} · ${esc(a.actor)}</small></div><p style="overflow-wrap:anywhere">${esc(a.details)}</p></div>`).join('')||empty('Try a workflow to create an activity trail.')}</section>`}
function csvCell(v){let s=String(v??'');if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function download(name,rows){const data='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('CSV exported from current demo records.')}
function exportHours(){requireAdmin();download('BFP-volunteer-hours.csv',[['Volunteer','Role','Clock in UTC','Clock out UTC','Elapsed seconds','Hours','Correction reason','Original in UTC','Original out UTC'],...report().map(s=>[person(s.person).name,s.role,new Date(s.adjustment?.in??s.in).toISOString(),new Date(s.adjustment?.out??s.out).toISOString(),seconds(s),seconds(s)/3600,s.adjustment?.reason||'',new Date(s.in).toISOString(),new Date(s.out).toISOString()])])}
function exportCoverage(){requireAdmin();download('BFP-volunteer-coverage.csv',[['Date','Start','End','Role','Location','Needed','Reserved','Available coverage','Open places','Closure'],...db.shifts.filter(s=>s.date>=scheduleFrom&&s.date<=scheduleTo).map(s=>[s.date,s.start,s.end,s.role,s.location,s.capacity,booked(s).length,closed(s.date)?0:eligibleBookings(s).length,closed(s.date)?0:Math.max(0,s.capacity-eligibleBookings(s).length),closed(s.date)?'Closed':'Open'])])}
function safe(fn){return e=>{try{fn(e)}catch(err){notify(err.message)}}}
function bindShared(root){root.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));root.querySelectorAll('[data-profile]').forEach(b=>b.onclick=()=>profile(b.dataset.profile));root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editProfile(b.dataset.edit));root.querySelectorAll('[data-availability]').forEach(b=>b.onclick=()=>addAvailability(b.dataset.availability));root.querySelectorAll('[data-remove-availability]').forEach(b=>b.onclick=safe(()=>{const p=person(b.dataset.person);if(!isAdmin()&&p.id!==selectedPerson)throw Error('Own availability only.');p.availability=p.availability.filter(a=>a.id!==b.dataset.removeAvailability);audit('Availability removed',p.name);save();if($('#modal').open)profile(p.id);else render()}));root.querySelectorAll('[data-recognize]').forEach(b=>b.onclick=safe(()=>recognize(b.dataset.recognize)));root.querySelectorAll('[data-certificate]').forEach(b=>b.onclick=()=>certificate(b.dataset.certificate));root.querySelectorAll('[data-cancel-booking]').forEach(b=>b.onclick=safe(()=>{cancelBooking(b.dataset.cancelBooking);render();notify('Reservation cancelled.')}));root.querySelectorAll('[data-adjust]').forEach(b=>b.onclick=()=>correction(b.dataset.adjust));root.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>$('#modal').close());root.querySelectorAll('#print').forEach(b=>b.onclick=()=>window.print())}
function bindModal(){bindShared($('#modal'));$('#modal').querySelectorAll('[data-direct-book]').forEach(b=>b.onclick=safe(()=>{requireAdmin();book(b.dataset.directBook,b.dataset.shift);$('#modal').close();render();notify('Place reserved.')}));const action=out=>()=>{try{if(!kioskPerson)throw Error('Enter your code again.');if(out)clockOut(kioskPerson);else clockIn(kioskPerson,$('#kioskRole').value);clearTimeout(kioskIdentify.timer);kioskPerson=null;$('#modal').close();render();notify(out?'You’re clocked out. Thank you for serving!':'You’re clocked in. Welcome!')}catch(err){$('#kioskActionError').textContent=err.message}};if($('#kioskIn'))$('#kioskIn').onclick=action(false);if($('#kioskOut'))$('#kioskOut').onclick=action(true)}
function bindPage(){bindShared($('#page'));bindShared($('#nav'));const on=(id,fn)=>{if($(id))$(id).onclick=safe(fn)},change=(id,fn)=>{if($(id))$(id).onchange=safe(fn)};on('#impactSettings',editImpactSettings);on('#addVolunteer',()=>editProfile());change('#statusFilter',e=>{statusFilter=e.target.value;render()});change('#roleFilter',e=>{roleFilter=e.target.value;render()});if($('#search'))$('#search').oninput=e=>{const n=e.target.selectionStart;search=e.target.value;render();$('#search').focus();$('#search').setSelectionRange(n,n)};document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{layout=b.dataset.layout;render()});change('#clockPerson',e=>{selectedPerson=e.target.value;render()});if($('#clockPerson'))$('#clockPerson').value=selectedPerson;change('#volunteerPerson',e=>{selectedPerson=e.target.value;render()});on('#clockIn',()=>{clockIn(selectedPerson,$('#clockRole').value);render();notify('Clocked in at the current time.')});on('#clockOut',()=>{clockOut(selectedPerson);render();notify('Clocked out. Your actual time is recorded.')});on('#addShift',createShift);on('#recurring',recurring);on('#coverageExport',exportCoverage);on('#addAway',()=>awayForm());on('#addClosure',()=>awayForm(true));on('#compose',compose);on('#reminders',reminders);on('#birthdayMessages',birthdayMessages);on('#exportHours',exportHours);change('#scheduleFrom',e=>{if(e.target.value>scheduleTo)throw Error('From must be before the end date.');scheduleFrom=e.target.value;render()});change('#scheduleTo',e=>{if(e.target.value<scheduleFrom)throw Error('End must be after the start date.');scheduleTo=e.target.value;render()});change('#reportFrom',e=>{if(e.target.value>reportTo)throw Error('From must be before the end date.');reportFrom=e.target.value;render()});change('#reportTo',e=>{if(e.target.value<reportFrom)throw Error('End must be after the start date.');reportTo=e.target.value;render()});change('#reportRole',e=>{reportRole=e.target.value;render()});change('#reportPerson',e=>{reportPerson=e.target.value;render()});document.querySelectorAll('[data-book]').forEach(b=>b.onclick=safe(()=>{book(selectedPerson,b.dataset.book);render();notify('Your place is reserved.')}));document.querySelectorAll('[data-assign]').forEach(b=>b.onclick=()=>assign(b.dataset.assign));document.querySelectorAll('[data-matches]').forEach(b=>b.onclick=()=>matches(b.dataset.matches));document.querySelectorAll('[data-remove-away]').forEach(b=>b.onclick=safe(()=>{const a=db.away.find(a=>a.id===b.dataset.removeAway);if(!isAdmin()&&a.person!==selectedPerson)throw Error('Own time away only.');db.away=db.away.filter(a=>a.id!==b.dataset.removeAway);audit('Time away removed',person(a.person).name);save();render()}));document.querySelectorAll('[data-remove-closure]').forEach(b=>b.onclick=safe(()=>{requireAdmin();db.closures=db.closures.filter(c=>c.id!==b.dataset.removeClosure);audit('Closure removed',b.dataset.removeClosure);save();render()}));document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{const input=$('#pin'),k=b.dataset.key;input.value=k==='Clear'?'':k==='⌫'?input.value.slice(0,-1):(input.value+k).slice(0,4)});if($('#kioskForm'))$('#kioskForm').onsubmit=e=>{e.preventDefault();try{kioskIdentify($('#pin').value);$('#pin').value=''}catch(err){$('#kioskError').textContent=err.message;$('#pin').value=''}}}
$('#mode').onchange=e=>{mode=e.target.value;kioskPerson=null;$('#modal').close();view=mode==='Coordinator'?'dashboard':mode==='Volunteer'?'profile':'clock';render()};$('#close').onclick=()=>{$('#modal').close();kioskPerson=null};$('#modal').addEventListener('cancel',()=>{kioskPerson=null});$('#reset').onclick=()=>showModal('Reset this volunteer demo?',`<p>This removes only this demo’s fictional profiles, bookings, clock sessions, messages and recognition from this browser.</p><div class="form-actions"><button data-close>Keep my changes</button><button class="danger" id="confirmReset">Reset demo</button></div>`);
$('#modal').addEventListener('click',e=>{if(e.target.id==='confirmReset'){db=seed();save();selectedPerson='V0';$('#modal').close();render();notify('Standalone volunteer demo reset.')}});
window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(titles[v]&&v!==view){view=v;render()}});window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{db=JSON.parse(e.newValue);render()}catch{notify('Unable to load demo update.')}}});
setInterval(()=>{if($('#elapsed')&&active(selectedPerson))$('#elapsed').textContent=elapsed(active(selectedPerson))},10000);
if(titles[location.hash.slice(1)])view=location.hash.slice(1);render();
